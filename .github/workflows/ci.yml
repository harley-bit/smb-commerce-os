name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: install, lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          rm gitleaks.tar.gz

      - name: Install syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin v1.51.1

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Dependency vulnerability scan
        run: pnpm audit --audit-level=high

      - name: Install semgrep
        run: python3 -m pip install --break-system-packages semgrep==1.176.0

      - name: Static analysis (semgrep)
        run: semgrep scan --config p/security-audit --error --exclude node_modules --exclude coverage --exclude dist .

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Isolation tests
        run: pnpm test:isolation

      - name: Secret scan
        run: gitleaks detect --source . --redact --exit-code 1

      - name: Generate SBOM (CycloneDX)
        run: syft dir:. -o cyclonedx-json=sbom.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
          retention-days: 90

  # PostgreSQL dialect job — docs/design/04's portability rules are a CI
  # failure, not a code review comment: this runs the db package's suite
  # against a real PostgreSQL service container so a migration or query
  # that only works on SQLite is caught the day it's written. The `build`
  # job above already covers the SQLite dialect (DATABASE_URL unset there,
  # so packages/db's PostgreSQL-only tests skip and its SQLite tests run).
  test-postgres:
    name: test (postgresql)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: smb_os
          POSTGRES_PASSWORD: smb_os
          POSTGRES_DB: smb_os_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://smb_os:smb_os@localhost:5432/smb_os_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Through turbo, not `pnpm --filter ... test`: turbo.json's
      # `test.dependsOn: ["^build"]` is what builds `@smb-os/domain`'s
      # `dist/` first. Bypassing it made every db test file fail to resolve
      # `@smb-os/domain` the first time this job actually ran (PR #7).
      - name: Test against PostgreSQL
        run: pnpm turbo run test --filter=@smb-os/db
